services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sailsoon
      POSTGRES_PASSWORD: sailsoon
      POSTGRES_DB: sailsoon
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailsoon"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SAILSOON_DATABASE_URL: postgresql+psycopg://sailsoon:sailsoon@db:5432/sailsoon
    command: >
      sh -c "alembic upgrade head && sailsoon sync && uvicorn sailsoon.api:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  # Run on an hourly cron to refresh forecasts. Adjust or swap for a k8s/systemd timer.
  ingest:
    build: .
    depends_on:
      api:
        condition: service_started
    environment:
      SAILSOON_DATABASE_URL: postgresql+psycopg://sailsoon:sailsoon@db:5432/sailsoon
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          sailsoon ingest-all || echo "ingest failed, retrying next cycle"
          sleep 3600
        done

volumes:
  pgdata:
