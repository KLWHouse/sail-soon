# Synology NAS override. Copy to docker-compose.override.yml next to
# docker-compose.yml before bringing the stack up:
#
#   cp docker-compose.synology.yml docker-compose.override.yml
#
# See docs/deploy-synology.md for the full walkthrough.

services:
  db:
    # Bind-mount Postgres data under /volume1/docker/... so Synology Hyper
    # Backup can grab it. You must pre-create the directory with the correct
    # ownership before `docker compose up`:
    #
    #   sudo mkdir -p /volume1/docker/sail-soon/pgdata
    #   sudo chown 70:70 /volume1/docker/sail-soon/pgdata   # uid 70 = postgres in postgres:16-alpine
    volumes:
      - /volume1/docker/sail-soon/pgdata:/var/lib/postgresql/data

  api:
    # Loopback-only: DSM's reverse proxy forwards :443 → :8765.
    # The base compose.yml intentionally has no ports mapping so this is the
    # only binding — port 8000 is NOT reachable externally.
    # For direct LAN access without a proxy, change to "8765:8000".
    ports:
      - "127.0.0.1:8765:8000"
    # --proxy-headers tells uvicorn to trust X-Forwarded-Proto/For from DSM's
    # reverse proxy so the app sees the real client IP and scheme (https).
    # --forwarded-allow-ips=* is safe here because the port is loopback-only.
    command: >
      sh -c "alembic upgrade head && sailsoon sync &&
             uvicorn sailsoon.api:app --host 0.0.0.0 --port 8000
             --proxy-headers --forwarded-allow-ips='*'"
    environment:
      # NWS rejects generic UAs. Put a real contact email here.
      SAILSOON_HTTP_USER_AGENT: "sail-soon/0.1 (you@example.com)"

  ingest:
    restart: unless-stopped
    environment:
      # NWS rejects generic UAs. Keep this in sync with the api service.
      SAILSOON_HTTP_USER_AGENT: "sail-soon/0.1 (you@example.com)"
